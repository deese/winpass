stages:
  - build
  - release

# Run only on tags (mirrored from GitHub)
workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/

variables:
  PACKAGE_NAME: winpass
  PACKAGE_URL: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${CI_COMMIT_TAG}

build:
  stage: build
  image: golang:1.24
  script:
    - apt-get update -qq && apt-get install -y -qq zip
    - mkdir -p dist
    - cd src
    - CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w -X main.version=${CI_COMMIT_TAG}" -o ../dist/winpass.exe .
    - cd ../dist
    - zip "winpass-${CI_COMMIT_TAG}-windows-amd64.zip" winpass.exe
    - sha256sum winpass.exe "winpass-${CI_COMMIT_TAG}-windows-amd64.zip" > SHA256SUMS
    # Release description: SHA-256 hashes rendered as a code block
    - |
      {
        echo "## SHA-256"
        echo
        echo '```'
        cat SHA256SUMS
        echo '```'
      } > RELEASE_NOTES.md
    # Upload to the project's generic package registry; release links point here
    - |
      for file in winpass.exe "winpass-${CI_COMMIT_TAG}-windows-amd64.zip" SHA256SUMS; do
        curl --fail --silent --show-error --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "${file}" "${PACKAGE_URL}/${file}"
      done
  artifacts:
    paths:
      - dist/

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: ["build"]
  script:
    - echo "Creating release ${CI_COMMIT_TAG}"
  release:
    tag_name: $CI_COMMIT_TAG
    name: $CI_COMMIT_TAG
    description: ./dist/RELEASE_NOTES.md
    assets:
      links:
        - name: winpass.exe
          url: ${PACKAGE_URL}/winpass.exe
          link_type: package
        - name: winpass-${CI_COMMIT_TAG}-windows-amd64.zip
          url: ${PACKAGE_URL}/winpass-${CI_COMMIT_TAG}-windows-amd64.zip
          link_type: package
        - name: SHA256SUMS
          url: ${PACKAGE_URL}/SHA256SUMS
          link_type: other
