name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: src/go.mod

      - name: Build
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          cd src
          go build -ldflags="-s -w" -o ../dist/winpass.exe .


      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} dist/winpass.exe --generate-notes
